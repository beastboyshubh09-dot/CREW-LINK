<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#176b5b" />
    <title>Offline | CrewLink</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f5f7f4; color: #192a26; font: 16px system-ui, sans-serif; }
      main { max-width: 430px; padding: 40px; border: 1px solid #e3ebe5; border-radius: 16px; background: white; }
      strong { color: #176b5b; }
      h1 { margin: 24px 0 8px; font-size: 30px; }
      p { color: #64746e; line-height: 1.6; }
      button { margin-top: 16px; padding: 12px 18px; border: 0; border-radius: 8px; background: #176b5b; color: white; font: inherit; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body><main><strong>CrewLink</strong><h1>You’re offline.</h1><p>Your connection dropped. Check your network and try again to get the latest job and crew updates.</p><button onclick="location.reload()">Try again</button></main></body>
</html>
