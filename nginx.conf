server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /firebase-messaging-sw.js {
        add_header Service-Worker-Allowed /firebase-messaging/;
        add_header Cache-Control no-cache;
    }
}